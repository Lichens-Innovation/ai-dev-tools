name: Sync skills and agents from plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/skills/**'
      - 'plugins/*/agents/**'
      - 'plugins/*/rules/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild skills/ from plugins
        run: |
          rm -rf skills/
          mkdir -p skills/
          shopt -s nullglob
          for skill_dir in plugins/*/skills/*/; do
            skill_name=$(basename "$skill_dir")
            cp -r "$skill_dir" "skills/$skill_name"
          done

      - name: Rebuild agents/ from plugins
        run: |
          rm -rf agents/
          mkdir -p agents/
          shopt -s nullglob
          for agent_dir in plugins/*/agents/*/; do
            agent_name=$(basename "$agent_dir")
            cp -r "$agent_dir" "agents/$agent_name"
          done

      - name: Enforce single source of truth for plugin rules/
        run: |
          shopt -s nullglob
          for rule_file in plugins/*/rules/*.md; do
            plugin_dir=$(dirname "$(dirname "$rule_file")")
            name=$(basename "$rule_file")
            matches=("$plugin_dir"/skills/*/references/"$name")
            if [ -f "${matches[0]:-}" ]; then
              cp "${matches[0]}" "$rule_file"
            fi
          done

      - name: Commit and push if changed
        run: |
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/ agents/ plugins/*/rules/*.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync skills, agents, and rules from plugins"
          git push
