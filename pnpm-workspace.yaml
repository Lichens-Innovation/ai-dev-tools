  unrs-resolver: true
minimumReleaseAgeExclude:
  - seroval@1.6.1 || 1.6.3
  - shell-quote@1.11.0
  - undici@7.29.0 || 7.29.1
  - source-map-js@1.2.2
  - '@eslint/plugin-kit@0.3.4'
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - postcss-selector-parser@7.1.6
overrides:
  "brace-expansion@<2": ^1.1.21
  "brace-expansion@>=5 <6": ^5.0.12
  browserslist: ^4.28.7
  "immutable@>=5 <6": ^5.1.8
  "js-yaml@>=4 <5": ^4.3.2
  "nanoid@<4": ^3.3.18
  postcss: 8.5.28
  "postcss-selector-parser@<7.1.6": ^7.1.6
  "seroval@<1.6.3": ^1.6.3
  "@eslint/plugin-kit@<0.3.4": ^0.3.4
